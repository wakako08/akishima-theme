name: Deploy theme to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: akishimajichiren.sakura.ne.jp
          username: akishimajichiren
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          # Sakura FTP initial folder is www, so theme path is under www/
          server-dir: /www/wp3/wp-content/themes/akishima/
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/.venv-map/**
            **/node_modules/**
            **/.DS_Store
            **/__pycache__/**
            **/*.pyc
            **/assets/images/wp3/**
            **/assets/videos/**
            **/.ftp-deploy-sync-state.json
