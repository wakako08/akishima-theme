name: Deploy theme to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare upload folder
        run: |
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='.venv-map' \
            --exclude='node_modules' \
            --exclude='.DS_Store' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='assets/images/wp3' \
            --exclude='assets/videos' \
            ./ ./deploy-upload/
          # Keep existing remote videos / local-only folders intact by not uploading them.

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          port: 22
          local_path: './deploy-upload/*'
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only: true
          password: ${{ secrets.SFTP_PASSWORD }}
          delete_remote_files: false
