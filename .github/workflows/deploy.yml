name: Deploy theme to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail

          if [ -z "${SFTP_HOST}" ] || [ -z "${SFTP_USERNAME}" ] || [ -z "${SFTP_PASSWORD}" ] || [ -z "${SFTP_REMOTE_PATH}" ]; then
            echo "Missing required secrets. Check SFTP_HOST / SFTP_USERNAME / SFTP_PASSWORD / SFTP_REMOTE_PATH."
            exit 1
          fi

          # Normalize remote path (no trailing slash for lftp mkdir/cd)
          REMOTE_PATH="${SFTP_REMOTE_PATH%/}"

          lftp -c "
            set sftp:auto-confirm yes
            set net:timeout 30
            set net:max-retries 2
            set net:reconnect-interval-base 5
            open -u ${SFTP_USERNAME},${SFTP_PASSWORD} sftp://${SFTP_HOST}
            mirror -R --verbose --parallel=2 \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob .vscode/ \
              --exclude-glob .venv-map/ \
              --exclude-glob node_modules/ \
              --exclude-glob .DS_Store \
              --exclude-glob __pycache__/ \
              --exclude-glob '*.pyc' \
              --exclude-glob assets/images/wp3/ \
              --exclude-glob assets/videos/ \
              --exclude-glob .ftp-deploy-sync-state.json \
              ./ ${REMOTE_PATH}/
            bye
          "
